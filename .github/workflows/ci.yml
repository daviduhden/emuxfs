---
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  openbsd-80-amd64:
    name: OpenBSD 8.0 (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run canonical agent knowledge tests
        run: python3 -m unittest discover -s tests/agent_knowledge_validator -v

      - name: Agent Knowledge Validation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate-agent-knowledge.py --scope range --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Build and test on OpenBSD 8.0 (amd64)
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: "8.0"
          arch: amd64
          sync-time: true
          copyback: false
          prepare: |
            set -eu

            echo "== VM environment =="
            uname -a
            uname -m

            echo "== FUSE device and headers =="
            # The FUSE library and headers are in the base system's comp set:
            # /usr/include/fuse/fuse.h and /usr/lib/libfuse.a.  Only the device
            # node may be missing from a minimal image.
            (cd /dev && ./MAKEDEV fuse) || true
            ls -l /dev/fuse0 2>/dev/null || true
            ls -l /usr/include/fuse/fuse.h
            ls -l /usr/lib/libfuse.a

            echo "== Clang =="
            clang --version

          run: perl "$GITHUB_WORKSPACE/scripts/ci-openbsd.pl"

  openbsd-80-arm64:
    name: OpenBSD 8.0 (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test on OpenBSD 8.0 (arm64)
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: "8.0"
          arch: aarch64
          sync-time: true
          copyback: false
          prepare: |
            set -eu

            echo "== VM environment =="
            uname -a
            uname -m

            echo "== FUSE device and headers =="
            # The FUSE library and headers are in the base system's comp set:
            # /usr/include/fuse/fuse.h and /usr/lib/libfuse.a.  Only the device
            # node may be missing from a minimal image.
            (cd /dev && ./MAKEDEV fuse) || true
            ls -l /dev/fuse0 2>/dev/null || true
            ls -l /usr/include/fuse/fuse.h
            ls -l /usr/lib/libfuse.a

            echo "== Clang =="
            clang --version

          run: perl "$GITHUB_WORKSPACE/scripts/ci-openbsd.pl"
